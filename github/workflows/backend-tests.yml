
name: Saturn backend tests

on:
  push:
    branches:
      - community-only-fix
    paths:
      - "lib/**"
      - "api/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node.js 22 backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install backend dependencies
        run: npm install

      - name: Run backend test suite
        run: npm test
        
